# 기획서 화면을 GitHub Pages 로 배포한다(DECISIONS §112).
#
# ★ 정본은 docs/proposal.docx 다. 사본을 커밋하지 않고 배포 직전에 _site/ 로 옮긴다
#   (파이어레인 tools/stage_pages.py 와 같은 관계). 두 벌이 커밋되면 한쪽만 고쳐진다.
#
# ★ 배포 전에 기획서 숫자를 정본과 대조한다. 낡은 기획서가 초록으로 올라가지 않게 한다.
#
# ★ 한 번은 손으로 켠다 — 저장소 설정의 Pages 소스를 "GitHub Actions" 로:
#     gh api -X POST repos/CleverAIFox/thoth/pages -f build_type=workflow
name: 기획서 배포

on:
  push:
    branches: [main]
    paths:
      - 'docs/proposal.docx'
      - 'site/**'
      - 'tools/docx_check.py'
      - '.github/workflows/proposal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}proposal.html
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.13" }
      # ★ **`--deploy` 는 생성기 지문 불일치를 실패로 읽는다**(DECISIONS §126).
      #   `doctor` 는 그것을 WARN 으로 둔다 — 다시 쓰는 중에 커밋을 막을 일은 아니지만
      #   **낡은 기획서를 밖으로 내보내는 것**은 막아야 한다.
      - run: python3 tools/docx_check.py --deploy
      - run: |
          mkdir -p _site
          cp site/* _site/
          cp docs/proposal.docx _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
