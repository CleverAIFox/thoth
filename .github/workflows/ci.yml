name: ci
on:
  push:
    branches: [main]
  pull_request:

# ★ **기본 권한을 닫는다.** 공개 저장소라 포크에서 PR 이 들어온다. 선언이 없으면
#   GITHUB_TOKEN 이 저장소 설정의 기본값을 받는데, 그 값은 워크플로를 건드리지
#   않고도 바뀐다 — 워크플로가 제 권한을 적어 두면 설정과 무관하게 고정된다.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # ★ gitleaks 는 누출을 찾으면 PR 에 위치를 댓글로 단다
    #   (`GITLEAKS_ENABLE_COMMENTS` 의 기본값이 켬이다). 읽기만 주면 그 댓글이
    #   실패한다. 탐지 자체는 종료 코드로 나오므로 빨간불은 어차피 뜬다.
    #
    # ★ **근거를 고쳤다 — 포크가 아니다**(DECISIONS §125). 2026-10-02 까지 위
    #   `permissions:` 의 주석이 「포크에서 PR 이 들어온다」 를 이 쓰기 권한의
    #   근거로 들었는데, **포크 PR 에서는 그 권한이 효력이 없다** — 포크의
    #   `GITHUB_TOKEN` 은 워크플로의 선언과 무관하게 읽기 전용으로 발급된다.
    #   이 권한이 쓰이는 것은 **이 저장소의 가지에서 올라온 PR** 이다.
    #   기본 권한을 닫는 까닭은 그대로 맞다 — 근거만 틀렸다.
    #
    # ★ **seshat 도 `write` 로 맞췄다.** 그쪽은 `read` 였고, 누출을 실제로 찾는
    #   날 댓글 호출이 403 으로 죽을 자리였다. **두 저장소가 같은 규율을
    #   공유한다고 적어 뒀으면 이런 어긋남을 검사가 잡아야 한다.**
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ★ 저장소 불변식의 정본은 tools/doctor.sh 하나다. CI 가 같은 검사를 다시
  #   구현하면 같은 사실이 두 곳에 살고 한쪽만 고쳐질 때 어긋난다
  #   (DECISIONS §14). 훅도 CI 도 같은 진입점을 부른다.
  #
  # ★ 훅은 --no-verify 로 넘어간다. CI 는 넘어갈 수 없다. 그래서 둘 다 있다.
  verify:
    runs-on: ubuntu-24.04
    # ★ **상한을 적는다**(파이어레인 `tools/actionpin.py` · DECISIONS §126). 없으면 GitHub 기본
    #   **6시간**까지 매달린다 — 러너 시간과, 자격증명을 든 작업이면 그 세션까지 같이 태운다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.13" }
      # ★ **jsdom 이 없으면 확장 검사 25건이 건너뛰어진다.** 로컬에서는 WARN 으로
      #   두는 것이 맞지만(DECISIONS §46) CI 는 넘어갈 수 없는 자리다. 여기서
      #   건너뛰면 초록불인 채로 수집이 깨진다(DECISIONS §54).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: "22", cache: npm, cache-dependency-path: extension/package-lock.json }
      - run: npm ci
        working-directory: extension
      # ★ **doctor 는 린터가 없으면 SKIP 한다.** 로컬에서는 맞지만 CI 는
      #   넘어갈 수 없는 자리다. 없으면 여기서 멈춘다 — 건너뛰면 초록불인 채로
      #   셸과 파이썬을 아무도 보지 않는다(DECISIONS §54 · §63).
      # ★ **`fmt` 만 본다.** `validate` 는 `init` 을 요구하고 `init` 은 프로바이더
      #   수백 MB 를 받는다. 커밋마다 받게 하면 검사가 네트워크에 기대게 된다.
      #   의미 검사는 이미 받아 둔 기계에서 `doctor` 가 본다(DECISIONS §73).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with: { terraform_wrapper: false }
      # ★ **`check_static` 이 yaml 없이 SKIP 하는 것을 CI 는 넘어가지 못한다.**
      #   워크플로가 깨지면 조용히 사라지고, 그 실패는 "워크플로가 없다" 로만
      #   보인다(DECISIONS §87 · §54).
      - run: python3 -m pip install pyyaml
      - name: 린터가 실제로 있는가
        run: |
          shellcheck --version | sed -n 2p
          uvx ruff --version
          terraform version | sed -n 1p
          # ★ **pyyaml 도 린터다**(DECISIONS §125). 바로 위 단계가 깔아 두는데
          #   이 단계는 셋만 확인했다 — `check_static` 은 `yaml` 이 없으면
          #   워크플로 검사를 **건너뛰고 0 으로 끝난다.** 즉 설치가 조용히
          #   실패하면 **초록불인 채로 검사가 사라진다.** 그 구멍을 막겠다고
          #   적어 놓고 단언만 빠져 있었다(§54).
          # ★ `python3 -m` 으로 부른다. `pip` 와 `python3` 가 다른 환경을
          #   가리키면 깔린 곳과 읽는 곳이 갈린다.
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)'
      - run: bash tools/doctor.sh --repo
      # ★ doctor 는 건너뛴 건수를 WARN 으로만 알린다. CI 에서는 0 이어야 하므로
      #   따로 확인한다 — 등급이 다른 두 자리에서 같은 검사를 쓴다.
      - name: 확장 검사가 건너뛰이지 않았는지
        run: |
          OUT="$(node --test "extension/tests/*.test.js" 2>&1)"
          echo "$OUT" | tail -8
          N="$(printf '%s' "$OUT" | sed -n 's/^# skipped \([0-9]*\)$/\1/p')"
          [ "${N:-0}" -eq 0 ] || { echo "건너뛴 검사 ${N}건 — CI 에서는 0 이어야 한다"; exit 1; }

  # 계약을 실제 HTTP 로 때린다. TestClient 는 미들웨어·포트·.env 로딩을
  # 건너뛰므로 pytest 만으로는 서빙 경로가 검증되지 않는다.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENGINE: echo
      CACHE: file
      CACHE_FILE: .cache/translations.json
      QUOTA_FILE: .cache/quota.json
      MAX_TEXT_LEN: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      # ★ **루프가 실패를 삼켰다**(DECISIONS §125). 30초 안에 안 뜨면 마지막
      #   `sleep 1` 의 종료 코드 0 으로 단계가 **통과**했고, 실패는 다음
      #   `smoke.sh` 에서 「워커에 닿지 못했다」 로 나타났다 — 원인이 「기동
      #   실패」 가 아니라 「스모크 실패」 로 보였다. `|| true` 를 걷어낸 그
      #   사고(2026-09-14)와 같은 종류다. **실패는 그것이 일어난 자리에서 알린다.**
      - name: 워커 기동
        run: |
          uv run uvicorn app.main:app --port 8000 > /tmp/worker.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health >/dev/null \
            || { echo "워커가 30초 안에 안 떴다"; cat /tmp/worker.log; exit 1; }
        working-directory: worker
      - run: bash tools/smoke.sh
      # ★ **러너가 끝까지 도는지만 본다.** CI 에는 GPU 가 없어 `ENGINE=echo` 로
      #   돌리므로 번역 품질은 볼 수 없다 — 45유닛이 전부 위반으로 나오고 그
      #   숫자는 아무 뜻이 없다. 임계값으로 쓰면 기준선을 모르고 정한 검사가
      #   된다(DECISIONS §19 · §55).
      #
      # ★ 러너는 300줄이 넘고 하루에 세 번 고쳐졌다(웜업 · 지문 · 환경 기록).
      #   케이스 파싱 · 배치 분할 · 워커 왕복 · 검사 실행이 한 번에 도는지는
      #   단위 테스트가 보지 못하는 자리다.
      # ★ **`|| true` 를 걷어냈다.** 러너의 종료 코드를 전부 삼켜서, 2026-09-14
      #   에 러너가 `warmup` 에서 터졌을 때 다음 줄의 JSON 파싱이 "파일이 없다"
      #   로 죽었다. 원인이 "러너가 죽었다" 가 아니라 다른 것으로 보였다(§37).
      #
      # ★ 종료 코드를 가른다 — 0 위반 없음 · 2 위반 있음 · 3 캐시 히트.
      #   `echo` 는 번역하지 않아 45유닛이 전부 위반이므로 2 가 정상이다.
      #   **3 은 통과시키지 않는다** — 캐시를 타면 러너를 검사한 것이 아니다.
      - name: 골든셋 러너가 끝까지 도는가
        run: |
          # ★ **배치를 명시한다.** 러너의 기본값은 기준선의 그 엔진 블록에서
          #   읽는데(§65) CI 는 `ENGINE=echo` 로 돌고 기준선에 `echo` 는 없다.
          #   러너가 조용히 다른 값으로 떨어지지 않고 멈추는 것이 맞는 동작이며,
          #   여기서는 부르는 쪽이 값을 준다. 품질을 보지 않으므로 어느 값이든
          #   되지만 **적지 않고 넘어가지는 않는다**(DECISIONS §69).
          set +e
          python3 tools/bench_golden.py --batch 3 --json /tmp/golden.json
          rc=$?
          set -e
          case "$rc" in
            0|2) : ;;
            3)   echo "캐시 히트로 돌았다 — 러너를 검사한 것이 아니다"; exit 1 ;;
            *)   echo "러너가 종료 코드 $rc 로 죽었다"; exit 1 ;;
          esac
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("/tmp/golden.json"))
          # 위반 수는 보지 않는다. echo 는 번역하지 않으므로 전부 위반이다.
          assert d["units"] == 45, f"유닛 {d['units']} — 케이스가 다 실리지 않았다"
          assert len(d["rows"]) == 45, "검사가 모든 유닛에서 돌지 않았다"
          assert d["prompt_fingerprint"], "지문이 비었다"
          assert d["warmup"] is True, "웜업이 돌지 않았다"
          assert d["cache_hits"] == 0, f"캐시 히트 {d['cache_hits']}건 — 측정이 아니다"
          assert d["engine"] == "echo", f"엔진이 {d['engine']} 다 — 워커 설정을 본다"
          print("러너 정상 —", d["units"], "유닛 ·", len(d.get("env", [])), "배치")
          EOF
      - if: failure()
        run: cat /tmp/worker.log
      # ★ 백그라운드 uvicorn 을 내린다. 남겨 두면 setup-uv 의 캐시 정리가
      #   프로세스를 기다리다 5분 타임아웃으로 잡을 실패시킨다. 검사는 통과
      #   했는데 정리가 죽어 빨간불이 나면 원인을 찾기 어렵다.
      - if: always()
        run: pkill -f "uvicorn app.main:app" || true
