name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 계약과 비용 가드는 로컬 훅에만 맡기지 않는다. 훅은 --no-verify 로 넘어간다.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q
        working-directory: worker

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python tools/check_docs.py

  # 확장에는 자동 테스트가 없다(PLAN §2-1 #41). 그전까지 정적 검사만이라도
  # 훅 밖에서 돈다 — 훅은 --no-verify 로 넘어간다.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS 문법
        run: |
          for f in extension/src/*.js extension/src/adapters/*.js; do
            node --check "$f"
          done
      - name: 콘텐츠 스크립트 최상위 선언
        run: |
          CS=$(grep -oE '"src/[^"]+\.js"' extension/src/background.js \
               | tr -d '"' | sed 's|^|extension/|')
          if grep -nE "^(let|const|class|function) " $CS; then
            echo "재주입 시 SyntaxError 가 된다 (DECISIONS §16)"
            exit 1
          fi
      - name: manifest 정합
        run: |
          python3 -c "
          import json, pathlib, re, sys
          root = pathlib.Path('extension')
          m = json.loads((root/'manifest.json').read_text())
          bg = root / m['background']['service_worker']
          miss = [str(bg)] if not bg.exists() else []
          miss += [f for f in re.findall(r'\"(src/[^\"]+\.js)\"', bg.read_text())
                   if not (root/f).exists()]
          print('누락:', miss) if miss else print('OK')
          sys.exit(1 if miss else 0)"

  # 계약을 실제 HTTP 로 때린다. TestClient 는 미들웨어·포트·.env 로딩을
  # 건너뛰므로 pytest 만으로는 서빙 경로가 검증되지 않는다.
  smoke:
    runs-on: ubuntu-latest
    env:
      ENGINE: echo
      CACHE: file
      CACHE_FILE: .cache/translations.json
      QUOTA_FILE: .cache/quota.json
      MAX_TEXT_LEN: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 워커 기동
        run: |
          uv run uvicorn app.main:app --port 8000 > /tmp/worker.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
        working-directory: worker
      - run: bash tools/smoke.sh
      - if: failure()
        run: cat /tmp/worker.log
      # ★ 백그라운드 uvicorn 을 내린다. 남겨 두면 setup-uv 의 캐시 정리가
      #   프로세스를 기다리다 5분 타임아웃으로 잡을 실패시킨다. 검사는 통과
      #   했는데 정리가 죽어 빨간불이 나면 원인을 찾기 어렵다.
      - if: always()
        run: pkill -f "uvicorn app.main:app" || true
