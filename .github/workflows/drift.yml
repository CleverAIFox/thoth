# 배포본이 main 의 코드인지 본다.
#
# ★ **CI 에 둔다.** 로컬 `doctor` 에서는 네트워크 · 자격증명 · zip 유무가
#   제각각이라 "못 쟀다" 가 기본값이 되고, 기본값이 된 경고는 아무도 읽지
#   않는다(DECISIONS §86). 여기서는 전제가 항상 참이다.
#
# ★ **일정으로도 돈다.** 드리프트는 커밋이 만드는 것이 아니라 시간이 만든다.
#   2026-09-15 에 배포본이 하루 묵은 코드로 돌고 있었고 커밋은 내내 멀쩡했다.
#
# ★ **키가 없다.** OIDC 로 실행마다 짧은 토큰을 받는다(infra/oidc.tf).
name: drift
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deployed-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # ★ 검사가 zip 을 만들지 않는다. 만드는 것은 여기 한 줄이고, 검사는 읽기만
      #   한다 — 상태를 바꾸는 검사를 만들지 않기 위해서다.
      - run: bash tools/package_lambda.sh
      - name: 임시 — 토큰이 무엇을 주장하는가
        run: |
          T=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 -c "
import base64,json,sys
p=sys.argv[1].split('.')[1]
p+='='*(-len(p)%4)
c=json.loads(base64.urlsafe_b64decode(p))
print('iss', c['iss']); print('aud', c['aud']); print('sub', c['sub'])
" "$T"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::917866274871:role/thoth-ci
          aws-region: ap-northeast-2
      - run: python3 tools/deploy_drift.py
