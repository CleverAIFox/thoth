[project]
name = "thoth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

# ★ **스타일이 아니라 오류만 본다.** `F` 는 미사용 import · 정의되지 않은 이름 ·
#   재정의를 잡는다. 2026-09-14 에 테스트 7개가 재정의로 죽어 있는 것을 이것이
#   찾았고, 그동안 pytest 도 doctor 도 CI 도 초록불이었다(DECISIONS §63).
#
# ★ 포매팅 규칙은 켜지 않는다. 커밋을 막을 일이 아닌 것을 막으면 급할 때
#   넘기는 버릇이 든다(DECISIONS §46).
[tool.ruff]
target-version = "py313"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
# ★ **`RUF100` — 죽은 억제를 막는다**(파이어레인 `tools/suppress.py` · DECISIONS §126).
#   2026-10-03 에 이 저장소의 `# noqa` 13개가 **전부 죽어 있었다** — `select` 가 `F` 하나인데
#   `E402` · `E731` · `N802` · `BLE001` · `C901` 을 적고 있었다. **아무것도 안 막으면서
#   「검사를 통과시켰다」 고 보이는 주석**이고, 파이어레인이 §279-4 로 적은 그 병이다.
#   이 규칙이 있으면 다시 안 생긴다 — 세는 래칫보다 낫다.
#
# ★ **규칙을 더 켜는 쪽은 안 했다.** 켜면 드는 값을 실측했다 —
#   `E402` 3 · `E7` 24 · `BLE001` 7 · `C901` 10 ·
#   `N802` **315**(이 저장소도 함수 이름이 한글이다) · `E9` **0**.
#   **13개 뒤에 숨은 결함이 하나도 없었다** — `E9` 가 0 이고 나머지는 전부 문체다.
#   파이어레인은 같은 자리에서 「규칙을 켜는 쪽이 낫다」 고 적었는데, 그쪽은 켜면
#   잡히는 것이 있었다. 여기는 없다. **빚이 아닌 것을 빚으로 적지 않는다.**
select = ["F", "RUF100"]
