<!doctype html>
<meta charset="utf-8">
<title>thoth</title>
<link rel="stylesheet" href="popup.css">

<!-- ★ 인라인 스크립트를 쓰지 않는다. MV3 의 기본 CSP 가 script-src 'self'
     이므로 인라인은 실행되지 않고, 팝업이 통째로 조용히 죽는다. -->
<main>
  <section id="site" class="row">
    <span id="site-state" class="state">…</span>
    <button id="enable" hidden>이 사이트에서 켜기</button>
  </section>

  <!-- ★ **「표시」 가 아니라 「번역」 이다**(DECISIONS §177). 종전 글자는 정직했지만
       사람은 「번역 끔」 으로 읽었고, 실제로는 상자만 숨고 **워커 호출과 과금이
       그대로 돌았다.** 끄면 수집까지만 돈다 — 그래서 글자도 그렇게 적는다. -->
  <section class="row">
    <label class="toggle">
      <input type="checkbox" id="show">
      <span>번역</span>
    </label>
    <kbd>Alt+K</kbd>
  </section>
  <p class="hint">끄면 <strong>수집까지만</strong> 돈다 — 워커를 부르지 않는다.</p>

  <section class="row">
    <button id="check">연결 확인</button>
    <span id="health" class="state"></span>
  </section>

  <details id="advanced">
    <summary>고급</summary>
    <label>엔드포인트
      <input type="url" id="endpoint" placeholder="http://127.0.0.1:8000/translate">
    </label>
    <label>토큰
      <input type="password" id="token" placeholder="워커가 요구할 때만">
    </label>
    <div class="row">
      <button id="save">저장</button>
      <span id="saved" class="state"></span>
    </div>
  </details>
</main>

<!-- ★ **팝업이 번역기와 같은 사슬을 쓴다**(DECISIONS §173). 종전에는 `popup.js` 만
     싣고 기본 주소 글자를 **제가 따로 들고** 있었다 — `config.local.js` 를 안 보니
     ext-build 에서 **번역은 람다로 가는데 팝업만 `127.0.0.1` 을 두드렸다.**
     ★ **클래식 스크립트는 순서대로, 모듈은 그 뒤에 돈다.** 그래서 `ST.CONFIG` 와
     `ST.쓸주소` 가 `popup.js` 가 돌 때 이미 서 있다.
     ★ **`client.js` 는 최상위에 정의뿐이다** — 부수효과가 없어 팝업에서 실어도
     아무 일도 안 일어난다. 그 자리는 `extension/tests/popup.test.js` 가 문다. -->
<script src="src/config.local.js"></script>
<script src="src/client.js"></script>
<script type="module" src="src/popup.js"></script>
