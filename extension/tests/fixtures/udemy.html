<!--
  **Udemy 어댑터가 무엇을 잡고 무엇을 놓치는지를 사이트 없이 가른다**(PLAN #25).

  ★ 마크업은 MASTER §3 의 DOM 계약(2026-09-12 실측)을 옮겼다. 실사이트를 대신하지
    않는다 — 계약이 늙으면 이 파일도 늙는다. 이 파일이 재는 것은 **계약이 깨졌을 때
    관측 행이 그것을 드러내는가**다.

  ★ **이 페이지가 스스로 채점한다**(DECISIONS §104). 화면마다 기대를 `data-expect`
    에 적어 두고, 확장이 보낸 관측과 화면에 실제로 붙은 번역 박스 수를 둘 다 대조해
    표로 세운다. **누른 순서는 상관없다** — 방문한 화면이 채워질 뿐이고, 여섯이 다
    차면 전부 통과다. `전체 순회` 버튼이 대신 눌러 주기도 한다.

  ★ **`data-expect` 가 정본이다.** `observe.test.js` 가 같은 속성을 읽어 jsdom 에서
    대조한다. 기대가 두 곳에 살면 갈린다(DECISIONS §14).

  ★ `127.0.0.1` 에서 Udemy 인 척한다. `<meta name="st-fixture-url">` 을 어댑터가
    `ST.pageUrl()` 로 읽고, 로컬 호스트에서만 먹는다(generic.js). **화면마다 주소가
    다르다** — 같으면 화면을 바꿔도 `settle` 관측이 다시 돌지 않는다.

  ★ 화면은 `<template>` 에 있고 버튼이 `#app` 을 갈아끼운다. 새로고침 대신 교체하는
    이유는 **세션 중에 DOM 이 바뀌는 것**을 재현하려는 것이다 — MutationObserver
    경로를 탄다.

  띄우기 :
    python3 -m http.server 8099 -d extension/tests/fixtures > /tmp/fx.log 2>&1 &
    ENGINE=echo bash tools/run_worker.sh > /tmp/w.log 2>&1 &
    http://127.0.0.1:8099/udemy.html          손으로 누른다
    http://127.0.0.1:8099/udemy.html?auto=1   열자마자 전체 순회

  ★ **워커는 저절로 로컬이다**(DECISIONS §106). 확장이 픽스처인 것을 알아보고
    팝업 설정과 상관없이 `127.0.0.1:8000` 을 때리며 토큰도 싣지 않는다. 그래도 어느
    워커로 나갔는지 위에 적고, 로컬이 아니면 주황으로 띄운다 — 두 번째 방어선이다.
-->

  <h1>AWS Certified Data Engineer Associate Practice Exams</h1>
  <p>Prepare for the certification with full-length practice tests that mirror the real exam.</p>
  <p>Every question comes with a detailed explanation of why each option is right or wrong.</p>

<script>
// ★ 이 스크립트는 **페이지 세계**에서 돈다. 확장의 `ST` 는 보이지 않으므로 관측은
//   `st:obs` 이벤트로 받는다(broker.js). 번역 박스는 DOM 이라 그냥 센다.
const SCREENS = [...document.querySelectorAll("template")].map((t) => ({
  id: t.id.slice(2),
  tpl: t,
  url: t.dataset.url,
  kind: t.dataset.kind,
  expected: t.dataset.expected === "true",
  probes: JSON.parse(t.dataset.expect || "{}"),
  units: Number(t.dataset.units),
  boxes: Number(t.dataset.boxes),
  want: t.dataset.want,
}));

const meta = document.querySelector("meta[name=st-fixture-url]");
const runs = new Map();          // id -> { rec, boxes, at }
const log = [];
let current = null;
let autoRunning = false;

const $ = (id) => document.getElementById(id);
const hhmmss = (d) => d.toTimeString().slice(0, 8);
const short = (p) => Object.entries(p).map(([k, v]) => `${k.replace("answer_", "")} ${v}`).join(" · ");
const canon = (o) => JSON.stringify(Object.entries(o ?? {}).sort());
const same = (a, b) => canon(a) === canon(b);

function note(what, detail) {
  log.push({ t: hhmmss(new Date()), what, detail: detail ?? "" });
  const d = document.createElement("div");
  d.textContent = `${log.at(-1).t}  ${what}${detail ? "  " + detail : ""}`;
  $("log").append(d);
  $("log").scrollTop = $("log").scrollHeight;
}

/** 한 화면의 판정. **둘을 따로 본다** — 관측(셀렉터가 몇 개를 잡았나)과 박스(실제로
 *  붙었나). 관측만 보면 워커가 죽어도 통과하고, 박스만 보면 왜 안 붙었는지 모른다. */
function verdict(s) {
  const r = runs.get(s.id);
  if (!r?.rec) return { state: "idle", text: "미방문" };
  const bad = [];
  if (!same(s.probes, r.rec.probes)) bad.push("probes");
  if (r.rec.kind !== s.kind) bad.push("kind");
  if (r.rec.expected !== s.expected) bad.push("expected");
  if (r.boxes !== s.boxes) bad.push("박스");
  if (r.loading) bad.push(`대기 ${r.loading}`);
  return bad.length
    ? { state: "fail", text: "실패 · " + bad.join(" ") }
    : { state: "pass", text: "통과" };
}

function render() {
  const body = $("grid").tBodies[0];
  body.replaceChildren();
  for (const s of SCREENS) {
    const r = runs.get(s.id);
    const v = verdict(s);
    const tr = document.createElement("tr");
    const cells = [
      s.id + (current === s.id ? " ←" : ""),
      v.text,
      short(s.probes),
      r?.rec ? short(r.rec.probes) : "—",
      r ? `${r.boxes} / ${s.boxes}` + (r.loading ? ` · 대기 ${r.loading}` : "") : `— / ${s.boxes}`,
      r?.rec ? `${r.rec.kind} · ${r.rec.expected}` : "—",
      s.want,
    ];
    cells.forEach((text, i) => {
      const td = document.createElement("td");
      td.textContent = text;
      if (i === 1) td.className = "v " + v.state;
      if (i === 2 || i === 3) td.className = "mono";
      td.style.whiteSpace = i >= 2 && i <= 4 ? "nowrap" : "";
      tr.append(td);
    });
    body.append(tr);
  }
  const done = SCREENS.filter((s) => verdict(s).state !== "idle");
  const pass = done.filter((s) => verdict(s).state === "pass").length;
  const all = pass === SCREENS.length;
  $("status").innerHTML = all
    ? `<span class="pass">화면 ${SCREENS.length}개 전부 통과</span>`
    : `방문 ${done.length} / ${SCREENS.length} · 통과 ${pass} · 실패 ${done.length - pass}`
      + (done.length ? "" : " — 화면 버튼을 누르거나 <b>전체 순회</b>");
}

function show(id) {
  const s = SCREENS.find((x) => x.id === id);
  if (!s) return;
  current = id;
  meta.content = s.url;                       // 어댑터가 새 페이지로 본다
  $("app").replaceChildren(s.tpl.content.cloneNode(true));
  runs.set(id, { rec: null, boxes: 0, loading: 0, sample: "", at: Date.now() });
  for (const b of $("modes").children) b.setAttribute("aria-pressed", String(b.dataset.mode === id));
  history.replaceState(null, "", "?mode=" + id);
  note("화면", id);
  render();
}

// ★ 관측은 **지금 보고 있는 화면**의 것으로 적는다. 관측 행은 경로를 싣지 않으므로
//   (강의 slug 가 들어 있다) 행만 보고는 어느 화면인지 알 수 없다. 늦게 도착한
//   관측도 `observe()` 가 부를 때의 DOM 을 재므로 현재 화면이 맞다.
document.addEventListener("st:obs", (e) => {
  let rec;
  try { rec = JSON.parse(e.detail); } catch { return note("관측", "JSON 이 아니다"); }
  $("worker").textContent = "워커 : " + (rec.worker || "아직 요청 없음");
  $("worker").className = rec.worker && !/^(127\.0\.0\.1|localhost)(:|$)/.test(rec.worker)
    ? "warn" : "note";
  if (!current) return note("관측", "화면 밖에서 왔다 — 무시한다");
  const r = runs.get(current);
  r.rec = rec;
  note("관측", `${current} · ${rec.reason} · ${short(rec.probes)} · blocks ${rec.blocks} · units ${rec.units}`);
  render();
});

// 박스는 DOM 이라 직접 센다. 번역이 늦게 붙으므로 계속 다시 센다.
//
// ★ **자리표시자를 번역으로 세지 않는다**(DECISIONS §105). 브로커는 요청을 보내기
//   전에 `st-translation--loading` 박스를 먼저 꽂는다. 그것까지 세면 **요청이 워커에
//   닿지 않고 매달려 있어도 통과**다 — 2026-09-22 에 워커 로그에 `POST` 가 0 건인데
//   여섯 줄이 초록이었다.
const DONE = ".st-translation:not(.st-translation--loading)";
setInterval(() => {
  if (!current) return;
  const done = $("app").querySelectorAll(DONE);
  const loading = $("app").querySelectorAll(".st-translation--loading").length;
  const r = runs.get(current);
  if (!r || (r.boxes === done.length && r.loading === loading)) return;
  r.boxes = done.length;
  r.loading = loading;
  // 무엇이 붙었는지 한 줄. `[KO] ` 면 echo 엔진, 한글이면 실제 엔진이다.
  r.sample = done[0]?.textContent.trim().slice(0, 48) || "";
  render();
}, 500);

/** 한 화면을 보여 주고 관측이 올 때까지 기다린다. 오지 않아도 진행한다 —
 *  기다리다 멈추면 나머지 화면을 영영 못 본다. */
function step(id, ms = 12000) {
  show(id);
  return new Promise((done) => {
    const t0 = Date.now();
    const timer = setInterval(() => {
      const r = runs.get(id);
      if (r?.rec || Date.now() - t0 > ms) { clearInterval(timer); setTimeout(done, 1500); }
    }, 250);
  });
}

async function auto() {
  if (autoRunning) return;
  autoRunning = true;
  $("auto").disabled = true;
  for (const [i, s] of SCREENS.entries()) {
    $("status").textContent = `전체 순회 ${i + 1}/${SCREENS.length} — ${s.id}`;
    await step(s.id);
  }
  autoRunning = false;
  $("auto").disabled = false;
  render();
}

function report() {
  const lines = ["# thoth udemy fixture", new Date().toISOString(),
                 "worker: " + ($("worker").textContent.replace("워커 : ", "")), ""];
  for (const s of SCREENS) {
    const r = runs.get(s.id);
    const v = verdict(s);
    lines.push(`[${v.text}] ${s.id}`);
    lines.push(`  기대 probes ${short(s.probes)} | 박스 ${s.boxes} | kind ${s.kind} · ${s.expected}`);
    lines.push(r?.rec
      ? `  실측 probes ${short(r.rec.probes)} | 박스 ${r.boxes} 대기 ${r.loading} | kind ${r.rec.kind} · ${r.rec.expected}`
        + ` | blocks ${r.rec.blocks} | units ${r.rec.units} | reason ${r.rec.reason}`
        + (r.rec.error ? ` | error ${r.rec.error}` : "")
        + (r.sample ? `\n  첫 박스 ${r.sample}` : "")
      : "  실측 없음");
  }
  lines.push("", "# 동작 기록");
  for (const l of log) lines.push(`${l.t}  ${l.what}  ${l.detail}`);
  return lines.join("\n");
}

for (const s of SCREENS) {
  const b = document.createElement("button");
  b.textContent = s.id;
  b.dataset.mode = s.id;
  b.onclick = () => show(s.id);
  $("modes").append(b);
}

$("auto").onclick = auto;
$("reset").onclick = () => { runs.clear(); log.length = 0; $("log").replaceChildren(); render(); };
$("copy").onclick = async () => {
  const text = report();
  // ★ 클립보드가 막히면 보고서를 화면에 편다. 실패를 조용히 넘기면 붙여넣기가
  //   빈 채로 끝나고, 그 침묵은 "복사됐다" 와 구별되지 않는다.
  try {
    await navigator.clipboard.writeText(text);
    note("보고서", "클립보드에 담았다");
  } catch {
    $("report").style.display = "block";
    $("report").value = text;
    $("report").select();
    note("보고서", "클립보드가 막혀 아래에 폈다 — 직접 복사한다");
  }
};

render();
const start = new URLSearchParams(location.search);
if (start.get("auto") === "1") auto();
else show(start.get("mode") || SCREENS[0].id);
</script>
