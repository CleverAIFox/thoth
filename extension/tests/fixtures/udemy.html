<script>
  const QUIZ_URL = document.querySelector("meta[name=st-fixture-url]").content;
  const modes = [...document.querySelectorAll("template")].map((t) => t.id.slice(2));
  const nav = document.getElementById("modes");

  function show(mode) {
    const t = document.getElementById("t-" + mode);
    if (!t) return;
    // URL 이 바뀌는 화면은 meta 를 바꾼다. 어댑터가 새 페이지로 본다.
    document.querySelector("meta[name=st-fixture-url]").content = t.dataset.url || QUIZ_URL;
    document.getElementById("app").replaceChildren(t.content.cloneNode(true));
    document.getElementById("want").textContent = "기대 : " + t.dataset.want;
    for (const b of nav.children) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
    history.replaceState(null, "", "?mode=" + mode);
  }

  for (const m of modes) {
    const b = document.createElement("button");
    b.textContent = m;
    b.dataset.mode = m;
    b.onclick = () => show(m);
    nav.append(b);
  }
  show(new URLSearchParams(location.search).get("mode") || "before");
</script>
